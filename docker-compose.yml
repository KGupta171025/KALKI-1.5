version: '3.8'

services:
  # 1. KALKI AI REST/GraphQL/WebSocket Gateway
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: kalki-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/kalki_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/kalki_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mongodb
      - neo4j
      - qdrant
    networks:
      - kalki-network

  # 2. Celery Worker (Asynchronous Task Runner)
  celery-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: kalki-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/kalki_db
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongodb:27017/kalki_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jpassword
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - mongodb
      - neo4j
      - qdrant
    networks:
      - kalki-network

  # 3. Next.js Studio Dashboard
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: kalki-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - kalki-network

  # 4. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kalki-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kalki_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kalki-network

  # 5. Redis Cache Store
  redis:
    image: redis:7-alpine
    container_name: kalki-redis
    ports:
      - "6379:6379"
    networks:
      - kalki-network

  # 6. RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kalki-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - kalki-network

  # 7. MongoDB Document Database
  mongodb:
    image: mongo:6-jammy
    container_name: kalki-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - kalki-network

  # 8. Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: kalki-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
    volumes:
      - neo4j_data:/data
    networks:
      - kalki-network

  # 9. Qdrant Vector Store
  qdrant:
    image: qdrant/qdrant:latest
    container_name: kalki-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - kalki-network

networks:
  kalki-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  neo4j_data:
  qdrant_storage:
